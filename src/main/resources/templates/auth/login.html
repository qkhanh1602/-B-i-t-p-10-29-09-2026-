<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - UTEShop</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <h1 style="text-align:center;">IOTSTAR SHOP</h1>
    <h2 style="text-align:center;">Đăng nhập</h2>

    <div class="alert error" th:if="${param.error}">
        Username/email hoặc password không đúng.
    </div>
    <div class="alert success" th:if="${param.logout}">
        Bạn đã đăng xuất thành công.
    </div>

    <form th:action="@{/login}" method="post">
        <div>
            <label class="auth-card label">Username hoặc Email</label>
            <input type="text"
                   name="username"
                   placeholder="Nhập username hoặc email"
                   required
                   autofocus>
        </div>

        <div>
            <label class="auth-card label">Mật khẩu</label>
            <input type="password"
                   name="password"
                   placeholder="Nhập mật khẩu"
                   required>
        </div>

        <div class="mt">
            <button class="btn primary full" type="submit">
                Đăng nhập
            </button>
        </div>
    </form>

    <p style="text-align:center; margin-top:20px;">
        <a th:href="@{/login}">Tạo tài khoản</a> &middot; <a th:href="@{/login}">Quên mật khẩu?</a>
    </p>
</div>
</body>
</html>
