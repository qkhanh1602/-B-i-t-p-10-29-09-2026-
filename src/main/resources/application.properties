spring.config.import=optional:file:.env[.properties]
spring.application.name=springsecurity6
server.port=${SERVER_PORT:8081}

# ===============================
# DATABASE CONFIGURATION
# ===============================
# Mặc định sử dụng H2 (lưu file tại ./data/webst9, tương thích SQL Server) để chạy ngay mà không cần bật service SQL Server.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/webst9;AUTO_SERVER=TRUE;MODE=MSSQLServer}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}

# Khi kết nối SQL Server thật, có thể cấu hình qua file .env hoặc bỏ comment các dòng sau:
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=webst9;encrypt=false;trustServerCertificate=true;sslProtocol=TLSv1.2;characterEncoding=UTF-8
# spring.datasource.username=sa
# spring.datasource.password=1234567@a$
# spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# THYMELEAF
# ===============================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ===============================
# ENCODING
# ===============================
spring.servlet.encoding.enabled=true
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true
spring.servlet.encoding.force-request=true
spring.servlet.encoding.force-response=true

spring.main.allow-bean-definition-overriding=true