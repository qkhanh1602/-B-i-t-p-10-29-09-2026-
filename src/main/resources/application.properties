spring.config.import=optional:file:.env[.properties]
spring.application.name=shop
server.port=${SERVER_PORT:8080}

# ===============================
# DATABASE
# ===============================
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/webst3;AUTO_SERVER=TRUE;MODE=MSSQLServer}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}

# Cấu hình SQL Server khi chạy thực tế (có thể đặt trong .env hoặc bỏ comment dưới đây):
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=webst3;encrypt=false;trustServerCertificate=true;sslProtocol=TLSv1.2;characterEncoding=UTF-8
# spring.datasource.username=sa
# spring.datasource.password=fdfdfd
# spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SMTP / MAIL
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:abc@gmail.com}
spring.mail.password=${MAIL_PASSWORD:zkhxpxxfcalaknld}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# CLOUDINARY
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dfdfdf}
cloudinary.api-key=${CLOUDINARY_API_KEY:576632571682623}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:ikPEbngxnKwAw-XkvR1WVEaQZcI}

# ===============================
# THYMELEAF
# ===============================
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ===============================
# MULTIPART / FILE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ===============================
# ENCODING
# ===============================
spring.servlet.encoding.enabled=true
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true
spring.servlet.encoding.force-request=true
spring.servlet.encoding.force-response=true

spring.main.allow-bean-definition-overriding=true